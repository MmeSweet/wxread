
name: wxread

concurrency:
  group: wxread-cookie-state
  cancel-in-progress: false

on:
  schedule:
    # 北京时间每天 01:07
    - cron: '7 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead

    steps:
      - name: Set DNS to Google's DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            certifi==2024.8.30 \
            charset-normalizer==3.4.0 \
            idna==3.10 \
            requests==2.32.3 \
            urllib3==2.2.3 \
            cryptography

      # 恢复上次加密保存的 Cookie
      - name: Restore encrypted cookies
        uses: actions/cache/restore@v4
        with:
          path: .wxread-state/cookies.enc
          key: wxread-cookie-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wxread-cookie-

      # 执行原来的自动阅读脚本
      - name: Run deployment script
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          WXREAD_COOKIE_KEY: ${{ secrets.WXREAD_COOKIE_KEY }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
          READ_NUM: ${{ vars.READ_NUM }}
        run: python main.py

      # 无论阅读任务是否成功，都保存已更新的 Cookie
      - name: Save encrypted cookies
        if: ${{ always() && hashFiles('.wxread-state/cookies.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .wxread-state/cookies.enc
          key: wxread-cookie-${{ github.run_id }}-${{ github.run_attempt }}

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
